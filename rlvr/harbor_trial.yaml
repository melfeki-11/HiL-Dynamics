# Harbor TrialConfig template shared by training (SkyRL HarborGenerator) and evaluation (eval.py),
# so the trained agent and the evaluated agent are identical. The model route
# (agent.model_name / agent.kwargs.api_base) is injected at runtime.
# Budgets: 30 agent turns, 32k context (the paper's SWE-agent setup allowed 100 steps / 64k).
trials_dir: runs/harbor-trials
timeout_multiplier: 1.0
# Task images are pulled on first use (several GB per SQL database / SWE repo); allow 30 min instead of
# Harbor's 10 min default for environment start. `bash rlvr/pull_images.sh rlvr/tasks` pre-pulls them.
environment_build_timeout_multiplier: 3.0
agent:
  name: terminus-2
  override_timeout_sec: 1800
  kwargs:
    max_turns: 30
    suppress_max_turns_warning: true
    enable_summarize: false          # required by step-wise training
    collect_rollout_details: true    # per-turn token ids + logprobs from vLLM
    temperature: 1.0
    model_info:
      max_input_tokens: 32768
      max_output_tokens: 2048
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
    llm_kwargs:
      timeout: 600
      max_retries: 0
      top_p: 1.0
environment:
  type: docker
  kwargs: {}
verifier:
  disable: false
  override_timeout_sec: 900
